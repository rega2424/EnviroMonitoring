<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Enviro Monitoring Access</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #e8f5e9, #c8e6c9);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 128, 0, 0.2);
      text-align: center;
      max-width: 400px;
    }

    .container h2 {
      color: #2e7d32;
      margin-bottom: 20px;
    }

    .leaf {
      font-size: 40px;
      color: #66bb6a;
      margin-bottom: 10px;
    }

    input[type="password"] {
      padding: 10px;
      width: 100%;
      font-size: 16px;
      margin-bottom: 20px;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
    }

    button {
      background-color: #43a047;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #388e3c;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="leaf">🍃</div>
    <h2>Akses Dashboard Lingkungan</h2>
    <input type="password" id="passwordInput" placeholder="Masukkan Password">
    <br>
    <button onclick="checkPassword()">Submit</button>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      const correct = "EnviroMonitoring";
      const url = "https://bit.ly/MineEnvironmentTBP";

      if (input === correct) {
        window.location.href = url;
      } else {
        alert("❌ Password salah!");
      }
    }
  </script>
</body>
</html>
